  curve_style: dubins
  min_radius: 2.0
  loop: false
  arrive_threshold: 0.1
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1
  sequential_cursor: true
  cursor_max_advance_distance: 0.5
