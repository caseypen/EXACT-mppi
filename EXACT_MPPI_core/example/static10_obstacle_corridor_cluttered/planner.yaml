MPPI:
  motion_model: diff
  model_dt: 0.1
  time_steps: 80
  batch_size: 1000
  iteration_count: 1
  temperature: 0.3
  gamma: 0.015
  vx_max: 3.0
  vx_min: -3.0
  wz_max: 3.0
  ax_max: 2.0
  ax_min: -2.0
  az_max: 2.0
  vx_std: 0.5
  wz_std: 2.0
  debug: true
  TrajectoryValidator:
    collision_lookahead_time: 2.0
    collision_margin_distance: 0.01
  Critics:
    ConstraintCritic:
      enabled: true
      cost_power: 1
      cost_weight: 4.0
    GoalCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 1.4
    GoalAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.0
      threshold_to_consider: 0.5
    ObstaclesCritic:
      enabled: true
      cost_power: 1
      repulsion_weight: 5.0
      critical_weight: 30.0
      collision_cost: 100000.0
      collision_margin_distance: 0.1
      near_goal_distance: 0.5
      repulsion_distance: 5.0
    PathAlignCritic:
      enabled: true
      cost_power: 1
      cost_weight: 4.0
      max_path_occupancy_ratio: 0.07
      trajectory_point_step: 4
      threshold_to_consider: 0.5
      offset_from_furthest: 20
      use_path_orientation: false
    PathFollowCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      offset_from_furthest: 12
      threshold_to_consider: 0.5
    PathAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 2.2
      offset_from_furthest: 4
      threshold_to_consider: 0.5
      max_angle_to_furthest: 0.785398
      mode: 1
    PreferForwardCritic:
      enabled: false
    VelocityDeadbandCritic:
      enabled: false
    TwirlingCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      pose_tolerance: 0.1
  footprint_type: rectangle
  vertices:
  - - - 0.9
      - 0.3
    - - -0.9
      - 0.3
    - - -0.9
      - -0.3
    - - 0.9
      - -0.3
  - - - -0.6
      - 1.2
    - - -0.9
      - 1.2
    - - -0.9
      - -1.2
    - - -0.6
      - -1.2
