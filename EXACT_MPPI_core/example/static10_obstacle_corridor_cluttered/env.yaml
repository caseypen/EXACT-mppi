world:
  height: 23
  width: 70
  step_time: 0.1
  sample_time: 0.1
  offset: [-3, 10]
  collision_mode: stop
  control_mode: auto

robot:
  - kinematics: {name: diff}
    shape:
      name: mosaic
      # The runner installs this T-union shape and generates the corridor walls.
      vertices:
        - [[0.9, 0.3], [-0.9, 0.3], [-0.9, -0.3], [0.9, -0.3]]
        - [[-0.6, 1.2], [-0.9, 1.2], [-0.9, -1.2], [-0.6, -1.2]]
    state: [0, 20, 0]
    goal: [60, 20, 0]
    vel_min: [-8, -1]
    vel_max: [8, 1]
    goal_threshold: 0.3
    description: T-shaped differential-drive robot in a static corridor-obstacle scene.
    plot:
      show_trail: true
      show_goal: true
      show_trajectory: false
    sensors:
      - type: lidar2d
        range_min: 0
        range_max: 12
        angle_range: 6.28
        number: 120
        noise: false
        has_velocity: true

obstacle: []
