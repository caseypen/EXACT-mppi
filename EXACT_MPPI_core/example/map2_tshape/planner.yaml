MPPI:
  motion_model_name: diff
  model_dt: 0.05
  time_steps: 100
  batch_size: 1000
  iteration_count: 1
  temperature: 0.3
  gamma: 0.015
  vx_max: 2.0
  vx_min: -2.0
  wz_max: 2.0
  ax_max: 4.0
  ax_min: -4.0
  az_max: 2.0
  vx_std: 1.5
  wz_std: 2.0
  retry_attempt_limit: 1
  open_loop: false
  seed: 0
  debug: true
  max_obs_num: 100
  TrajectoryValidator:
    collision_lookahead_time: 3.0
    collision_margin_distance: 0.01
  Critics:
    ConstraintCritic:
      enabled: true
      cost_power: 1
      cost_weight: 4.0
    GoalCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 3.5
    GoalAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.0
      threshold_to_consider: 2.0
    ObstaclesCritic:
      enabled: true
      cost_power: 1
      repulsion_weight: 1.0
      critical_weight: 30.0
      collision_cost: 100000.0
      collision_margin_distance: 0.1
      near_goal_distance: 0.5
      repulsion_distance: 2.5
    PointCBFCritic:
      enabled: false
      gamma_cbf: 1.0
      safety_distance: 0.1
      margin_scale: 1.0
      critical_weight: 1.0
      cost_power: 2
      mode: continuous
      relative_flow_bound: 0.0
    PathAlignCritic:
      enabled: true
      cost_power: 1
      cost_weight: 10.0
      max_path_occupancy_ratio: 0.07
      trajectory_point_step: 4
      threshold_to_consider: 0.5
      offset_from_furthest: 25
      use_path_orientation: false
    PathFollowCritic:
      enabled: true
      cost_power: 1
      cost_weight: 12.0
      offset_from_furthest: 15
      use_furthest_reached: false
      threshold_to_consider: 1.0
    PathAngleCritic:
      enabled: false
      cost_power: 1
      cost_weight: 2.2
      offset_from_furthest: 25
      threshold_to_consider: 0.5
      max_angle_to_furthest: 0.785398
      mode: 1
    PreferForwardCritic:
      enabled: false
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 0.5
    VelocityDeadbandCritic:
      enabled: true
      cost_power: 1
      cost_weight: 35.0
      deadband_velocities:
      - 0.0
      - 0.0
      - 0.0
    TwirlingCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      pose_tolerance: 0.1
